version: '3.8'

services:
  # MySQL Database Engine (Default production/containerized database)
  db:
    image: mysql:8.0
    container_name: sru_hostel_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_secure_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hostel_db}
      MYSQL_USER: ${MYSQL_USER:-hostel_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hostel_password_secure_2026}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hostel_network

  # Python Flask Backend Service (Running Gunicorn WSGI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sru_hostel_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://${MYSQL_USER:-hostel_user}:${MYSQL_PASSWORD:-hostel_password_secure_2026}@db:3306/${MYSQL_DATABASE:-hostel_db}}
      SECRET_KEY: ${SECRET_KEY:-prod_secure_secret_key_change_me_sru_2026_minimum_32chars}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-prod_secure_jwt_key_change_me_sru_2026_minimum_32chars}
      JWT_ACCESS_TOKEN_EXPIRES_HOURS: ${JWT_ACCESS_TOKEN_EXPIRES_HOURS:-24}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost,http://127.0.0.1,http://localhost:80}
      PORT: 5000
    volumes:
      - backend_qr_data:/app/static/qrcodes
      - backend_data:/app/data
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - hostel_network

  # React + Vite Frontend (Served via Nginx Reverse Proxy)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sru_hostel_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - hostel_network

volumes:
  mysql_data:
    name: sru_hostel_mysql_data
  backend_qr_data:
    name: sru_hostel_qr_data
  backend_data:
    name: sru_hostel_data

networks:
  hostel_network:
    name: sru_hostel_network
    driver: bridge
