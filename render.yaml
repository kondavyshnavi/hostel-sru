services:
  # Python Flask Backend Web Service
  - type: web
    name: sru-hostel-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt && python seed.py"
    startCommand: "cd backend && gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120 app:create_app()"
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRES_HOURS
        value: "24"
      - key: FRONTEND_URL
        fromService:
          type: web
          name: sru-hostel-frontend
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: sru-hostel-db
          property: connectionString

  # React + Vite Static Frontend Site
  - type: web
    name: sru-hostel-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sru-hostel-backend
          property: host

databases:
  # Managed PostgreSQL Database (Free tier on Render, compatible with SQLAlchemy models)
  - name: sru-hostel-db
    region: oregon
    plan: free
    databaseName: hostel_db
    user: hostel_user
